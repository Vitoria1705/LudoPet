<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Resultado da Busca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container py-5">

    <div class="text-center mb-5">

        <h1>Resultado da Busca</h1>

        <p class="text-muted"
           th:text="${mensagem}">
        </p>

    </div>

    <div th:if="${#lists.isEmpty(animais)}"
         class="alert alert-warning">

        Nenhum animal semelhante foi encontrado.

    </div>

    <div class="row g-4"
         th:if="${!#lists.isEmpty(animais)}">

        <div class="col-md-4"
             th:each="animal : ${animais}">

            <div class="card h-100 shadow">

                <img th:src="${animal.foto}"
                     class="card-img-top">

                <div class="card-body">

                    <h3 th:text="${animal.nome}">
                    </h3>

                    <p>

                        <strong>Raça:</strong>

                        <span th:text="${animal.raca}">
                        </span>

                    </p>

                    <p>

                        <strong>Cor:</strong>

                        <span th:text="${animal.cor}">
                        </span>

                    </p>

                    <p>

                        <strong>Cidade:</strong>

                        <span th:text="${animal.cidade}">
                        </span>

                    </p>

                    <p>

                        <strong>Status:</strong>

                        <span th:text="${animal.status}">
                        </span>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
