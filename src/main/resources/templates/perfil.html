<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meu Perfil - LudoPet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #F0F4FF;
        }

        .perfil-hero {
            background: #1B3FAB;
            padding: 3rem 0 6rem;
        }

        .hero-kicker {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.55);
            margin-bottom: 0.5rem;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: #fff;
            margin-bottom: 0.4rem;
        }

        .hero-sub {
            font-size: 14px;
            color: rgba(255,255,255,0.65);
        }

        .avatar-circle {
            width: 56px;
            height: 56px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
        }

        .perfil-wrapper {
            margin-top: -4rem;
        }

        .perfil-card {
            background: #fff;
            border: 1.5px solid #E8EDFB;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(27,63,171,0.07);
        }

        .section-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #1B3FAB;
            margin-bottom: 1rem;
            display: block;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .form-control {
            border: 1.5px solid #E5E7EB;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #1B3FAB;
            box-shadow: 0 0 0 3px rgba(27,63,171,0.08);
        }

        .btn-salvar {
            background: #1B3FAB;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }

        .btn-salvar:hover {
            background: #1532A0;
            transform: translateY(-1px);
        }

        .btn-voltar {
            background: transparent;
            border: 1.5px solid #E8EDFB;
            border-radius: 10px;
            padding: 11px 24px;
            font-size: 14px;
            font-weight: 500;
            color: #6B7280;
            font-family: 'DM Sans', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-voltar:hover {
            background: #F3F4F6;
            color: #374151;
        }

        .divider {
            border: none;
            border-top: 1.5px solid #F3F4F6;
            margin: 1.5rem 0;
        }
    </style>
</head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<!-- HERO -->
<section class="perfil-hero">
    <div class="container">
        <div class="d-flex align-items-center gap-3">
            <div class="avatar-circle"
                 th:text="${#strings.substring(usuario.nome, 0, 1)}">U</div>
            <div>
                <p class="hero-kicker mb-0">Configurações</p>
                <h1 class="hero-title mb-0">Meu Perfil</h1>
                <p class="hero-sub mb-0" th:text="${usuario.email}">email@exemplo.com</p>
            </div>
        </div>
    </div>
</section>

<!-- FORMULÁRIO -->
<main class="container perfil-wrapper pb-5">
    <div class="row g-4">

        <!-- Formulário principal -->
        <div class="col-lg-8">
            <div class="perfil-card">
                <span class="section-label">Informações pessoais</span>

                <form th:action="@{/perfil/salvar}"
                      method="post"
                      th:object="${usuario}">

                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label">Nome completo</label>
                            <input type="text" class="form-control"
                                   th:field="*{nome}" placeholder="Seu nome">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Telefone</label>
                            <input type="text" class="form-control"
                                   th:field="*{telefone}" placeholder="(98) 99999-9999">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Cidade</label>
                            <input type="text" class="form-control"
                                   th:field="*{cidade}" placeholder="São Luís">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Estado</label>
                            <input type="text" class="form-control"
                                   th:field="*{estado}" placeholder="MA">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Tipo de perfil</label>
                            <input type="text" class="form-control"
                                   th:field="*{tipo}" placeholder="Adotante">
                        </div>

                        <div class="col-12">
                            <label class="form-label">Descrição</label>
                            <textarea class="form-control" rows="4"
                                      th:field="*{descricao}"
                                      placeholder="Conte um pouco sobre você..."></textarea>
                        </div>
                    </div>

                    <hr class="divider">

                    <div class="d-flex gap-3 flex-wrap">
                        <button type="submit" class="btn-salvar">
                            <i class="bi bi-check2 me-2"></i>Salvar alterações
                        </button>
                        <a href="/dashboard" class="btn-voltar">
                            <i class="bi bi-arrow-left"></i> Voltar
                        </a>
                    </div>

                </form>
            </div>
        </div>

        <!-- Card lateral -->
        <div class="col-lg-4">
            <div class="perfil-card">
                <span class="section-label">Resumo da conta</span>

                <div class="d-flex flex-column gap-3">

                    <div style="background:#F0F4FF; border-radius:12px; padding:16px;">
                        <div style="font-size:11px; color:#9CA3AF; margin-bottom:4px;">Nome</div>
                        <div style="font-size:14px; font-weight:500; color:#111827;"
                             th:text="${usuario.nome}">—</div>
                    </div>

                    <div style="background:#F0F4FF; border-radius:12px; padding:16px;">
                        <div style="font-size:11px; color:#9CA3AF; margin-bottom:4px;">Email</div>
                        <div style="font-size:14px; font-weight:500; color:#111827;"
                             th:text="${usuario.email}">—</div>
                    </div>

                    <div style="background:#F0F4FF; border-radius:12px; padding:16px;">
                        <div style="font-size:11px; color:#9CA3AF; margin-bottom:4px;">Cidade</div>
                        <div style="font-size:14px; font-weight:500; color:#111827;"
                             th:text="${usuario.cidade != null ? usuario.cidade : 'São Luís, MA'}">—</div>
                    </div>

                    <div style="background:#F0F4FF; border-radius:12px; padding:16px;">
                        <div style="font-size:11px; color:#9CA3AF; margin-bottom:4px;">Tipo</div>
                        <div style="font-size:14px; font-weight:500; color:#111827;"
                             th:text="${usuario.tipo != null ? usuario.tipo : 'Adotante'}">—</div>
                    </div>

                </div>

                <hr class="divider">

                <a href="/logout" style="display:flex; align-items:center; gap:8px;
                   color:#EF4444; font-size:13px; font-weight:500; text-decoration:none;">
                    <i class="bi bi-box-arrow-right"></i> Sair da conta
                </a>
            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
