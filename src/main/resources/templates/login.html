<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - LudoPet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        /* ── CONFIGURAÇÃO GLOBAL DA TELA ── */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #F8FAFC;
            display: flex;
            flex-direction: column;
            font-family: 'Nunito', sans-serif;
            overflow-y: auto; /* Permite rolar a tela até o footer sem vãos */
        }

        header, .navbar {
            background-color: #2563EB !important; /* Azul Royal oficial */
            position: relative;
            z-index: 1000;
            width: 100%;
        }

        /* ── ESTRUTURA DO SPLIT CORRIGIDA (SEM VÃOS) ── */
        .auth-wrap-split {
            display: flex;
            width: 100%;
            /* Faz o split ocupar todo o espaço vertical disponível e colar no footer */
            flex: 1 0 auto;
        }

        /* Coluna Esquerda - Banner Azul */
        .auth-l-split {
            flex: 1;
            background-color: #2563EB;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 8%;
            color: #FFFFFF;
        }

        .auth-l-split h2 {
            font-family: 'Fraunces', serif;
            font-weight: 900;
            font-size: clamp(1.8rem, 3vw, 2.6rem);
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .auth-l-split p {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: rgba(255, 255, 255, 0.85);
            font-size: 1rem;
            margin-bottom: 30px;
            max-width: 480px;
        }

        .auth-feats-split {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 480px;
        }

        .af-split {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Coluna Direita - Área do Formulário */
        .auth-r-split {
            flex: 1;
            background-color: #F8FAFC;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        /* Box do Formulário */
        .auth-box-split {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.03);
            width: 100%;
            max-width: 440px; /* Um pouco mais estreito mantendo a elegância */
        }

        .fg-split label {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 5px;
            display: block;
        }

        .fg-split input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid #CBD5E1;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s;
        }

        .fg-split input:focus {
            border-color: #2563EB;
        }

        /* Remove a margem superior nativa do seu fragmento para colar perfeitamente */
        .premium-footer {
            margin-top: 0 !important;
            flex-shrink: 0;
        }

        @media (max-width: 991px) {
            .auth-wrap-split { flex-direction: column; }
            .auth-l-split { padding: 40px 20px; }
            .auth-r-split { padding: 40px 10px; }
        }
    </style>
</head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="auth-wrap-split">

    <div class="auth-l-split">
        <h2>Faça parte da <em style="color: #FFD43B; font-style: normal;">rede</em> LudoPet</h2>
        <p>Uma plataforma dedicada a unir quem quer adotar, apoiar e cuidar melhor dos pets in São Luís.</p>

        <div class="auth-feats-split">
            <div class="af-split"><span class="af-ic-split"><i class="bi bi-heart-fill text-white"></i></span><span class="af-tx-split">Adote animais com segurança</span></div>
            <div class="af-split"><span class="af-ic-split"><i class="bi bi-geo-alt-fill text-white"></i></span><span class="af-tx-split">Ache pets perdidos pelo mapa</span></div>
            <div class="af-split"><span class="af-ic-split"><i class="bi bi-bag-heart-fill text-white"></i></span><span class="af-tx-split">Compre na loja e ajude abrigos</span></div>
        </div>
    </div>

    <div class="auth-r-split">
        <div class="auth-box-split">
            <div class="auth-tabs-split mb-4">
                <button class="atab-split on" onclick="location.href='/login'">Entrar</button>
                <button class="atab-split" onclick="location.href='/cadastro'">Cadastrar</button>
            </div>

            <h2 style="font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.5rem; color: #0F172A;">Bem-vindo de volta!</h2>
            <p class="sub-split text-muted" style="font-family: 'Plus Jakarta Sans'; font-size: 0.88rem; margin-bottom: 24px;">Entre com seu e-mail e senha.</p>

            <form th:action="@{/login}" method="post" class="d-flex flex-column gap-3">
                <div class="fg-split">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="fg-split">
                    <label for="senha">Senha</label>
                    <input id="senha" type="password" name="senha" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn text-white w-100 mt-2" style="background: #2563EB; font-family: 'Plus Jakarta Sans'; font-weight: 800; padding: 12px; border-radius: 8px; border: none; transition: background 0.2s;">Entrar →</button>
            </form>

            <div th:if="${erro}" class="alert alert-danger mt-3 mb-0" style="border-radius: 11px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.85rem; font-weight: 600;">
                <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${erro}">Erro</span>
            </div>

            <p style="text-align:center; margin-top:24px; font-size:.84rem; color:var(--muted); font-family: 'Plus Jakarta Sans', sans-serif; mb-0;">
                Sem conta? <a th:href="@{/cadastro}" style="color:#EF4444; font-weight:700; text-decoration:none;">Cadastre-se</a>
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
