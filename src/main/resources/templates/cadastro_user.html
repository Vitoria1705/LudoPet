<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro - LudoPet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        /* ── CONFIGURAÇÃO GLOBAL DA TELA ── */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #F8FAFC;
            display: flex;
            flex-direction: column;
            font-family: 'Nunito', sans-serif;
        }

        header, .navbar {
            background-color: #2563EB !important; /* Azul Royal oficial */
            position: relative;
            z-index: 1000;
            width: 100%;
        }

        /* ── ESTRUTURA DO SPLIT CORRIGIDA (SEM VÃOS) ── */
        .auth-wrap-split {
            display: flex;
            width: 100%;
            /* Faz com que a seção ocupe toda a altura disponível e empurre o footer,
               eliminando vãos vazios no meio da tela */
            flex: 1 0 auto;
        }

        /* Coluna Esquerda - Banner Azul */
        .auth-l-split {
            flex: 1;
            background-color: #2563EB;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 8%;
            color: #FFFFFF;
        }

        .auth-l-split h2 {
            font-family: 'Fraunces', serif;
            font-weight: 900;
            font-size: clamp(1.8rem, 3vw, 2.6rem);
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .auth-l-split p {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: rgba(255, 255, 255, 0.85);
            font-size: 1rem;
            margin-bottom: 30px;
            max-width: 480px;
        }

        .auth-feats-split {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 480px;
        }

        .af-split {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Coluna Direita - Área do Formulário */
        .auth-r-split {
            flex: 1;
            background-color: #F8FAFC;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        /* Box do Formulário Compacto */
        .auth-box-split {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.03);
            width: 100%;
            max-width: 540px;
        }

        .fg-split label {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 5px;
            display: block;
        }

        .fg-split input, .fg-split select {
            width: 100%;
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid #CBD5E1;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.15s;
        }

        .fg-split input:focus, .fg-split select:focus {
            border-color: #2563EB;
        }

        /* O seu fragmento de footer às vezes injeta margem pelo Bootstrap.
           Essa regra zera e garante colagem total. */
        .premium-footer {
            margin-top: 0 !important;
            flex-shrink: 0;
        }

        @media (max-width: 991px) {
            .auth-wrap-split { flex-direction: column; }
            .auth-l-split { padding: 40px 20px; }
            .auth-r-split { padding: 40px 10px; }
        }
    </style>
</head>
<body>

<!-- 1. NAVBAR NO TOPO -->
<header th:replace="~{fragments/navbar :: navbar}"></header>

<!-- 2. DIVISÃO DA TELA (SPLIT CORES) -->
<main class="auth-wrap-split">

    <!-- Lado Esquerdo Azul -->
    <div class="auth-l-split">
        <h2>Faça parte da <em style="color: #FFD43B; font-style: normal;">rede</em> LudoPet</h2>
        <p>Uma plataforma dedicada a unir quem quer adotar, apoiar e cuidar melhor dos pets em São Luís.</p>

        <div class="auth-feats-split">
            <div class="af-split"><span class="af-ic-split"><i class="bi bi-heart-fill text-white"></i></span><span class="af-tx-split">Adote animais com segurança</span></div>
            <div class="af-split"><span class="af-ic-split"><i class="bi bi-geo-alt-fill text-white"></i></span><span class="af-tx-split">Ache pets perdidos pelo mapa</span></div>
            <div class="af-split"><span class="af-ic-split"><i class="bi bi-bag-heart-fill text-white"></i></span><span class="af-tx-split">Compre na loja e ajude abrigos</span></div>
        </div>
    </div>

    <!-- Lado Direito Form -->
    <div class="auth-r-split">
        <div class="auth-box-split">
            <div class="auth-tabs-split mb-4">
                <button class="atab-split" onclick="location.href='/login'">Entrar</button>
                <button class="atab-split on" onclick="location.href='/cadastro'">Cadastrar</button>
            </div>

            <h2 style="font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.4rem; color: #0F172A;">Criar conta</h2>
            <p class="sub-split text-muted" style="font-family: 'Plus Jakarta Sans'; font-size: 0.85rem; margin-bottom: 20px;">Cadastre seus dados para usar o ecossistema LudoPet Store.</p>

            <form th:action="@{/cadastro}" method="post" class="row g-3 auth-form-brutal">
                <div class="col-md-6 fg-split">
                    <label for="nome">Nome completo</label>
                    <input id="nome" type="text" name="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="col-md-6 fg-split">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="col-md-6 fg-split">
                    <label for="senha">Senha</label>
                    <input id="senha" type="password" name="senha" placeholder="••••••••" required>
                </div>

                <div class="col-md-6 fg-split">
                    <label for="telefone">Telefone</label>
                    <input id="telefone" type="text" name="telefone" placeholder="(98) 9xxxx-xxxx">
                </div>

                <div class="col-md-8 fg-split">
                    <label for="endereco">Endereço</label>
                    <input id="endereco" type="text" name="endereco" placeholder="Rua, número, bairro...">
                </div>

                <div class="col-md-4 fg-split">
                    <label for="tipo">Tipo de perfil</label>
                    <select id="tipo" name="tipo">
                        <option value="adotante">🐱 Adotante</option>
                        <option value="ong">🏢 ONG</option>
                        <option value="doador">🎁 Doador</option>
                        <option value="clinica">🩺 Clínica</option>
                        <option value="hospital">🏥 Hospital</option>
                    </select>
                </div>

                <div class="col-md-8 fg-split">
                    <label for="descricao">Descrição do perfil ou empresa</label>
                    <input id="descricao" type="text" name="descricao" placeholder="Fale um pouco sobre você ou sua empresa...">
                </div>

                <div class="col-md-4 fg-split">
                    <label for="servicos">Serviços</label>
                    <input id="servicos" type="text" name="servicos" placeholder="Vacinação, exames...">
                </div>

                <div class="col-md-6 fg-split">
                    <label for="cidade">Cidade</label>
                    <input id="cidade" type="text" name="cidade" value="São Luís">
                </div>

                <div class="col-md-6 fg-split">
                    <label for="estado">Estado</label>
                    <input id="estado" type="text" name="estado" value="MA">
                </div>

                <div class="col-12 d-flex gap-2 flex-wrap mt-3">
                    <button type="submit" class="btn text-white px-4" style="background: #2563EB; font-family: 'Plus Jakarta Sans'; font-weight: 800; padding: 10px 20px; border-radius: 8px; border: none;">Cadastrar conta →</button>
                    <a href="/login" class="btn text-secondary px-4" style="background: #E2E8F0; font-family: 'Plus Jakarta Sans'; font-weight: 700; padding: 10px 20px; border-radius: 8px; text-decoration: none;">Já tenho conta</a>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- 3. FOOTER OFICIAL COMPLETO EXATAMENTE ABAIXO DA DIVISÃO -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
