<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Animal | LudoPet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>

        body{
            background:#F7F6F2;
            font-family:'DM Sans',sans-serif;
        }

        .card-form{
            max-width:900px;
            margin:40px auto;
            background:white;
            border-radius:18px;
            padding:40px;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        h2{
            color:#1B3FAB;
            font-weight:700;
        }

        .titulo{
            border-bottom:2px solid #FFD43B;
            padding-bottom:10px;
            margin-bottom:30px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card-form">

        <div class="titulo">

            <h2>🐾 Cadastro de Animal</h2>

            <p class="text-muted">
                Preencha todas as informações do pet.
            </p>

        </div>

        <form
                th:action="@{/cadastro-animal}"
                method="post"
                enctype="multipart/form-data">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">Nome</label>

                    <input
                            type="text"
                            class="form-control"
                            name="nome"
                            required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">Espécie</label>

                    <select
                            class="form-select"
                            name="especie">

                        <option>Cachorro</option>
                        <option>Gato</option>
                        <option>Ave</option>
                        <option>Outro</option>

                    </select>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">Raça</label>

                    <input
                            type="text"
                            class="form-control"
                            name="raca">

                </div>

                <div class="col-md-3 mb-3">

                    <label class="form-label">Idade</label>

                    <input
                            type="text"
                            class="form-control"
                            name="idade"
                            placeholder="Ex: 2 anos">

                </div>

                <div class="col-md-3 mb-3">

                    <label class="form-label">Sexo</label>

                    <select
                            class="form-select"
                            name="sexo">

                        <option>Macho</option>
                        <option>Fêmea</option>

                    </select>

                </div>

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">

                    <label class="form-label">Porte</label>

                    <select
                            class="form-select"
                            name="porte">

                        <option>Pequeno</option>
                        <option>Médio</option>
                        <option>Grande</option>

                    </select>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">Cor</label>

                    <input
                            type="text"
                            class="form-control"
                            name="cor">

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">Peso</label>

                    <input
                            type="text"
                            class="form-control"
                            name="peso"
                            placeholder="Ex: 12 kg">

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">Cidade</label>

                    <input
                            type="text"
                            class="form-control"
                            name="cidade">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">Estado</label>

                    <input
                            type="text"
                            class="form-control"
                            name="estado">

                </div>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Descrição

                </label>
                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Personalidade</label>

                        <input
                                type="text"
                                class="form-control"
                                name="personalidade"
                                placeholder="Ex: Brincalhão, dócil...">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">RG Pet</label>

                        <input
                                type="text"
                                class="form-control"
                                name="rgPet">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-3 mb-3">

                        <label class="form-label">Vacinado?</label>

                        <select
                                class="form-select"
                                name="vacinado">

                            <option>Sim</option>
                            <option>Não</option>

                        </select>

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">Castrado?</label>

                        <select
                                class="form-select"
                                name="castrado">

                            <option>Sim</option>
                            <option>Não</option>

                        </select>

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">Vermifugado?</label>

                        <select
                                class="form-select"
                                name="vermifugado">

                            <option>Sim</option>
                            <option>Não</option>

                        </select>

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">Microchip?</label>

                        <select
                                class="form-select"
                                name="microchip">

                            <option>Sim</option>
                            <option>Não</option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Status

                        </label>

                        <select
                                class="form-select"
                                name="status">

                            <option value="disponivel">
                                Disponível
                            </option>

                            <option value="adotado">
                                Adotado
                            </option>

                            <option value="em processo">
                                Em processo
                            </option>

                        </select>

                    </div>

                </div>
                <div class="mb-4">

                    <label class="form-label">

                        Foto do Animal

                    </label>

                    <input
                            type="file"
                            class="form-control"
                            name="arquivo"
                            accept="image/*"
                            required>

                </div>


                <div class="text-end">

                    <button
                            class="btn btn-primary btn-lg">

                        💾 Salvar Animal

                    </button>

                </div>
                <textarea
                        class="form-control"
                        rows="5"
                        name="descricao"></textarea>

            </div>

            <!-- AQUI CONTINUAREMOS -->

        </form>

    </div>

</div>

</body>

</html>
